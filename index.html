<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>企鵝資金控制台</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 18px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      font-size: 18px;
    }

    #result,
    #previewResult {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🐧 企鵝資金控制台</h1>

  <p>💰 本月收入</p>
  <input id="income" type="number" placeholder="輸入本月收入">

  <p>📈 先投資多少</p>
  <input id="investment" type="number" placeholder="輸入投資金額">

  <p>🔒 已承諾支出</p>
  <input id="committed" type="number" placeholder="手機、私教、訂閱等">

  <p>🛟 保命金</p>
  <input id="buffer" type="number" placeholder="這筆錢先不要碰">

  <button onclick="calculateMoney()">計算企鵝 HP</button>

  <div id="result">
    ❤️ 尚未計算
  </div>

  <hr style="margin: 35px 0;">

  <h2>🔮 試算一筆</h2>

  <p>想買多少錢的東西？</p>
  <input id="purchase" type="number" placeholder="例如：2500">

  <button onclick="previewPurchase()">先看看買完剩多少</button>

  <div id="previewResult">
    🐧 尚未試算
  </div>
<script>
  let currentFreeHP = 0;

  function calculateMoney() {
    let income =
      Number(document.getElementById("income").value);

    let investment =
      Number(document.getElementById("investment").value);

    let committed =
      Number(document.getElementById("committed").value);

    let buffer =
      Number(document.getElementById("buffer").value);

    // 💾 記住輸入的資料
    localStorage.setItem("income", income);
    localStorage.setItem("investment", investment);
    localStorage.setItem("committed", committed);
    localStorage.setItem("buffer", buffer);

    let lifePool = income - investment;

    currentFreeHP =
      lifePool - committed - buffer;

    document.getElementById("result").innerHTML =
      "❤️ 本月生活池：$" +
      lifePool.toLocaleString() +
      "<br><br>✨ 真正自由 HP：$" +
      currentFreeHP.toLocaleString();
  }

  function previewPurchase() {
    let purchase =
      Number(document.getElementById("purchase").value);

    let afterPurchase =
      currentFreeHP - purchase;

    document.getElementById("previewResult").innerHTML =
      "🐧 現在 HP：$" +
      currentFreeHP.toLocaleString() +
      "<br><br>💥 買完會剩：$" +
      afterPurchase.toLocaleString();
  }

  // 🐧 網頁打開時，把以前的資料拿回來
  window.addEventListener("DOMContentLoaded", function() {

    let income = localStorage.getItem("income");
    let investment = localStorage.getItem("investment");
    let committed = localStorage.getItem("committed");
    let buffer = localStorage.getItem("buffer");

    if (income !== null) {
      document.getElementById("income").value = income;
    }

    if (investment !== null) {
      document.getElementById("investment").value = investment;
    }

    if (committed !== null) {
      document.getElementById("committed").value = committed;
    }

    if (buffer !== null) {
      document.getElementById("buffer").value = buffer;
    }

    // 如果以前填過，就自動重新計算
    if (
      income !== null &&
      investment !== null &&
      committed !== null &&
      buffer !== null
    ) {
      calculateMoney();
    }
  });
</script>

</body>
</html>
